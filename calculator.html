<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .calculator {
      background: #ffffff;
      padding: 20px 30px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 45%;
      padding: 10px;
      margin: 8px 5px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #2563eb;
      color: white;
    }

    button:hover {
      background-color: #1e40af;
    }

    .result {
      margin-top: 15px;
      font-weight: bold;
      color: #111;
    }
  </style>
</head>

<body>

  <div class="calculator">
    <h2>Calculator</h2>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <div>
      <button onclick="calculate('+')">+</button>
      <button onclick="calculate('-')">−</button>
    </div>

    <div>
      <button onclick="calculate('*')">×</button>
      <button onclick="calculate('/')">÷</button>
    </div>

    <div class="result" id="result">
      Result:
    </div>
  </div>

  <script>
    function calculate(operator) {
      var num1 = parseFloat(document.getElementById("num1").value);
      var num2 = parseFloat(document.getElementById("num2").value);
      var result;

      if (operator === '+') {
        result = num1 + num2;
      } 
      else if (operator === '-') {
        result = num1 - num2;
      } 
      else if (operator === '*') {
        result = num1 * num2;
      } 
      else if (operator === '/') {
        if (num2 === 0) {
          document.getElementById("result").innerHTML = "Cannot divide by zero";
          return;
        }
        result = num1 / num2;
      }

      document.getElementById("result").innerHTML = "Result: " + result;
    }
  </script>

</body>
</html>
